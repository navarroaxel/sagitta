<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 30 600 490" font-family="system-ui, sans-serif">
  <!--
    Structure: 3D column, 5 m, vertical (along z), fixed (built-in) to the ground at its base A,
      free at the top B. Solid web. Drawn in oblique projection.
      Axes (the course's left-handed triad): x to the right, y horizontal, out of the plane of the
      drawing (toward the viewer, drawn down-left), z vertical (up).
    World in metres. Transform: sx = 300 + (x*60 - y*21) ; sy = 420 - (z*60 - y*15)
      (x/z at 60 px/m; the y axis is only drawn as direction u = (-21,15) px per metre,
       no dimension is read along it)
    Nodes:
      A  (0,0,0)  fixed / built-in base          -> (300,420)
      B  (0,0,5)  free top of the column (loaded) -> (300,120)
    Members:
      A-B  column (5 m)
    Supports: A fixed in 3D (restrains all 3 forces and 3 moments).
    Loads (units: kg and kg.m):
      q_y = 200 kg/m along +y (toward the viewer) over the whole column (z = 0..5 m): it PULLS the
        column toward +y (arrows leave the column, they do not press on it)
        -> resultant Q_y = 200 x 5 = 1 000 kg along +y at z = 2.5 m
      B : P_z = 20 000 kg downward (-z; direction assumed, it was not stated)
          P_x = 1 500 kg along +x (to the right)
    Support reactions (computed):
      A: F_x = 1 500 kg (along -x) ; F_y = 1 000 kg (along -y) ; F_z = 20 000 kg (up) ;
         M_x = 2 500 kg.m (vector along +x) ; M_y = 7 500 kg.m (vector along -y) ; M_z = 0
    Equilibrium (moments as r x F, same arithmetic as t-frame-3d-fixed-kg.svg):
      SumFx = -1 500 + 1 500 = 0 ; SumFy = -1 000 + 1 000 = 0 ; SumFz = 20 000 - 20 000 = 0
      SumMx_A = M_x - 2.5 * 1 000 = 2 500 - 2 500 = 0
      SumMy_A = M_y + 5 * 1 500 = -7 500 + 7 500 = 0   (P_x at height 5)
      SumMz_A = 0
    The given reactions satisfy global equilibrium.
  -->

  <rect x="40" y="30" width="600" height="490" fill="#ffffff"/>

  <!-- ===== Dimensions ===== -->
  <g stroke="#9aa0a6" stroke-width="1" fill="#5f6368" font-size="12">
    <!-- column (left): 5.00 m -->
    <line x1="75" y1="120" x2="75" y2="420"/>
    <line x1="70" y1="120" x2="80" y2="120"/>
    <line x1="70" y1="420" x2="80" y2="420"/>
    <text x="63" y="270" text-anchor="middle" stroke="none" transform="rotate(-90 63 270)">5.00 m</text>
  </g>

  <!-- ===== Fixed / built-in base at A (ground plate in the xy plane + hatch) ===== -->
  <g stroke="#1a1a1a" stroke-width="2" fill="#ffffff" fill-opacity="0.85">
    <polygon points="246,430 326,430 354,410 274,410"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="254" y1="430" x2="246" y2="438"/><line x1="264" y1="430" x2="256" y2="438"/><line x1="274" y1="430" x2="266" y2="438"/><line x1="284" y1="430" x2="276" y2="438"/><line x1="294" y1="430" x2="286" y2="438"/><line x1="304" y1="430" x2="296" y2="438"/><line x1="314" y1="430" x2="306" y2="438"/><line x1="324" y1="430" x2="316" y2="438"/>
  </g>

  <!-- ===== Column ===== -->
  <g stroke="#1a1a1a" stroke-width="5" stroke-linecap="round">
    <line x1="300" y1="420" x2="300" y2="120"/>
  </g>

  <!-- ===== Nodes ===== -->
  <g fill="#1a1a1a">
    <circle cx="300" cy="420" r="4"/>
    <circle cx="300" cy="120" r="4"/>
  </g>

  <!-- ===== Node labels ===== -->
  <g font-size="13" font-weight="600" fill="#6a1b9a">
    <text x="314" y="404" text-anchor="start">A</text>
    <text x="312" y="144" text-anchor="start">B</text>
  </g>

  <!-- ===== Axes triad (global system) ===== -->
  <g stroke="#5f6368" fill="#5f6368" font-size="13" font-weight="600">
    <line x1="560" y1="300" x2="592" y2="300" stroke-width="2"/>
    <polygon points="600,300 591,304 591,296" stroke="none"/>
    <text x="606" y="304" stroke="none">x</text>
    <line x1="560" y1="300" x2="560" y2="268" stroke-width="2"/>
    <polygon points="560,260 564,269 556,269" stroke="none"/>
    <text x="556" y="252" stroke="none" text-anchor="middle">z</text>
    <line x1="560" y1="300" x2="524.5" y2="325.4" stroke-width="2"/>
    <polygon points="518,330 523,321.5 527.6,328" stroke="none"/>
    <text x="506" y="342" stroke="none">y</text>
  </g>

  <!-- ===== Loads (red) ===== -->
  <g stroke="#c0392b" fill="#c0392b" font-size="13" font-weight="700">
    <!-- q_y = 200 kg/m along +y over the whole column: arrows start at the column and point toward
         +y (down-left), so the load pulls it; thin rail through the tips -->
    <line x1="296.8" y1="392.3" x2="274" y2="408.6" stroke-width="2"/>
    <polygon points="266.7,413.8 272.9,402 279.9,411.7" stroke="none"/>
    <line x1="296.8" y1="332.3" x2="274" y2="348.6" stroke-width="2"/>
    <polygon points="266.7,353.8 272.9,342 279.9,351.7" stroke="none"/>
    <line x1="296.8" y1="272.3" x2="274" y2="288.6" stroke-width="2"/>
    <polygon points="266.7,293.8 272.9,282 279.9,291.7" stroke="none"/>
    <line x1="296.8" y1="212.3" x2="274" y2="228.6" stroke-width="2"/>
    <polygon points="266.7,233.8 272.9,222 279.9,231.7" stroke="none"/>
    <line x1="296.8" y1="152.3" x2="274" y2="168.6" stroke-width="2"/>
    <polygon points="266.7,173.8 272.9,162 279.9,171.7" stroke="none"/>
    <line x1="266.7" y1="413.8" x2="266.7" y2="173.8" stroke-width="1.5"/>
    <text x="254.7" y="293.8" text-anchor="middle" transform="rotate(-90 254.7 293.8)" stroke="none">q<tspan font-size="10" dy="4">y</tspan><tspan dx="2" dy="-4">= 200 kg/m</tspan></text>

    <!-- P_z = 20 000 kg downward at B (tip at the node, shaft trailing up) -->
    <line x1="300" y1="64" x2="300" y2="109" stroke-width="2.5"/>
    <polygon points="300,120 294,108 306,108" stroke="none"/>
    <text x="312" y="84" text-anchor="start" stroke="none">P<tspan font-size="10" dy="4">z</tspan><tspan dx="2" dy="-4">= 20 000 kg</tspan></text>

    <!-- P_x = 1 500 kg along +x at B (tip at the node, shaft trailing left) -->
    <line x1="244" y1="120" x2="289" y2="120" stroke-width="2.5"/>
    <polygon points="300,120 288,114 288,126" stroke="none"/>
    <text x="288" y="110" text-anchor="end" stroke="none">P<tspan font-size="10" dy="4">x</tspan><tspan dx="2" dy="-4">= 1 500 kg</tspan></text>
  </g>

  <!-- ===== Support reactions (blue) ===== -->
  <g stroke="#1a73e8" fill="#1a73e8" font-size="13" font-weight="700">
    <!-- F_x = 1 500 kg along -x (to the left); drawn just left of the plate pointing in the force
         direction: a shaft trailing right would run along the M_x vector -->
    <line x1="250" y1="420" x2="218" y2="420" stroke-width="2.5"/>
    <polygon points="206,420 218,414 218,426" stroke="none"/>
    <text x="200" y="424" text-anchor="end" stroke="none">F<tspan font-size="10" dy="4">x</tspan><tspan dx="2" dy="-4">= 1 500 kg</tspan></text>

    <!-- F_y = 1 000 kg along -y (away from the viewer, up-right); line of action through A, drawn on
         the near side with the tip pulled back ~32 px to keep the support clear -->
    <line x1="238.2" y1="464.2" x2="265.9" y2="444.4" stroke-width="2.5"/>
    <polygon points="274,438.6 267.7,450.5 260.7,440.7" stroke="none"/>
    <text x="222" y="468" text-anchor="end" stroke="none">F<tspan font-size="10" dy="4">y</tspan><tspan dx="2" dy="-4">= 1 000 kg</tspan></text>

    <!-- F_z = 20 000 kg upward at A (tip at the node, shaft trailing below) -->
    <line x1="300" y1="460" x2="300" y2="432" stroke-width="2.5"/>
    <polygon points="300,422 294,434 306,434" stroke="none"/>
    <text x="310" y="448" text-anchor="start" stroke="none">F<tspan font-size="10" dy="4">z</tspan><tspan dx="2" dy="-4">= 20 000 kg</tspan></text>

    <!-- M_x = 2 500 kg.m: moment vector along +x (double arrow), line of action through A -->
    <line x1="300" y1="420" x2="372" y2="420" stroke-width="2.5"/>
    <polygon points="390,420 380,425 380,415" stroke="none"/>
    <polygon points="380,420 370,425 370,415" stroke="none"/>
    <text x="400" y="424" text-anchor="start" stroke="none">M<tspan font-size="10" dy="4">x</tspan><tspan dx="2" dy="-4">= 2 500 kg&#183;m</tspan></text>

    <!-- M_y = 7 500 kg.m: moment vector along -y (away from the viewer, up-right; double arrow), collinear with F_y -->
    <line x1="329.3" y1="399.1" x2="350.4" y2="384" stroke-width="2.5"/>
    <polygon points="365.1,373.5 360.5,384.2 353.5,374.4" stroke="none"/>
    <polygon points="357,379.3 352.3,390 345.3,380.2" stroke="none"/>
    <text x="372" y="370" text-anchor="start" stroke="none">M<tspan font-size="10" dy="4">y</tspan><tspan dx="2" dy="-4">= 7 500 kg&#183;m</tspan></text>
  </g>

  <text x="340" y="505" text-anchor="middle" fill="#5f6368" font-size="13">
    3D column, fixed at A. Loads red, reactions blue; double arrow = moment vector.
  </text>
</svg>
